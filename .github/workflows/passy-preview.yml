name: Passy preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    if: github.head_ref == 'codex/passy-three-flows-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: passy-web-preview
          path: build/web
